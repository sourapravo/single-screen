<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f3ef">
<title>PhD Notebook — Protected</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="login.css">
</head>
<body>
<main class="gate">
  <div class="gate-inner">
    <div class="projector" aria-hidden="true">
      <svg viewBox="0 0 220 150">
        <path class="beam" d="M147 66 L213 39 L213 111 L147 84 Z"/>
        <g class="reel reel-left">
          <circle class="reel-ring" cx="54" cy="48" r="31"/>
          <circle class="reel-core" cx="54" cy="48" r="8"/>
          <circle class="hub" cx="54" cy="48" r="4"/>
          <g class="spokes">
            <path d="M54 48 L54 20"/><path d="M54 48 L79 34"/>
            <path d="M54 48 L79 62"/><path d="M54 48 L54 76"/>
            <path d="M54 48 L29 62"/><path d="M54 48 L29 34"/>
          </g>
        </g>
        <g class="reel reel-right">
          <circle class="reel-ring" cx="116" cy="39" r="36"/>
          <circle class="reel-core" cx="116" cy="39" r="9"/>
          <circle class="hub" cx="116" cy="39" r="4"/>
          <g class="spokes">
            <path d="M116 39 L116 7"/><path d="M116 39 L144 23"/>
            <path d="M116 39 L144 55"/><path d="M116 39 L116 71"/>
            <path d="M116 39 L88 55"/><path d="M116 39 L88 23"/>
          </g>
        </g>
        <path class="machine" d="M46 78 H143 Q149 78 149 84 V117 H39 V86 Q39 78 46 78 Z"/>
        <path class="machine-light" d="M55 87 H132 V101 H55 Z"/>
        <path class="machine-top" d="M61 68 H128 V78 H61 Z"/>
        <path class="machine-base" d="M29 117 H158 V128 H29 Z"/>
        <path class="support" d="M76 78 L69 61"/><path class="support" d="M121 72 L122 61"/>
        <circle class="control" cx="61" cy="109" r="5"/><circle class="control" cx="79" cy="109" r="5"/>
        <rect class="switch" x="98" y="104" width="10" height="11" rx="1"/>
        <rect class="switch" x="114" y="104" width="10" height="11" rx="1"/>
      </svg>
    </div>

    <h1>PhD Notebook — Protected</h1>
    <div class="identity">
      <div>Sourapravo Chatterjee</div>
      <div>Department of Design, IIT Hyderabad</div>
    </div>

    <form id="login-form" autocomplete="off">
      <label class="sr-only" for="passphrase">Enter passphrase</label>
      <div class="password-wrap">
        <input id="passphrase" type="password" placeholder="Enter passphrase"
               spellcheck="false" autocomplete="off" autocapitalize="none" required>
        <button type="button" id="toggle-password" class="eye"
                aria-label="Show passphrase" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M2.5 12s3.4-5.5 9.5-5.5S21.5 12 21.5 12 18.1 17.5 12 17.5 2.5 12 2.5 12Z"/>
          <circle cx="12" cy="12" r="2.7"/></svg>
        </button>
      </div>
      <button class="enter" type="submit">Enter</button>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
    </form>
  </div>
</main>
<script src="login.js"></script>
</body>
</html>
